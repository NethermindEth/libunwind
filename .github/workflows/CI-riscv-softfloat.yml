name: CI - RISC-V soft-float

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**'
      - '!README.md'
      - '!doc/**'
      - '!.**'
      - '.github/workflows/CI-riscv-softfloat.yml'
  push:
    branches:
      - v[0-9].*
      - master

jobs:
  # Compile every RISC-V source for the soft-float ABI using the stock hard-float
  # cross toolchain.  configure runs with the toolchain's default (lp64d) flags so
  # that its link tests pass; the objects are then rebuilt with lp64 flags, which
  # needs no soft-float libc because --disable-shared/--disable-tests leave nothing
  # to link -- the libraries are archived with ar.  This covers every source the
  # ABI touches, including src/setjmp (jmpbuf.h), and needs neither emulation nor a
  # soft-float userspace, so it is the cheap gate for the job below.
  rv64ima-build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 15
    name: riscv64-linux-gnu (rv64ima, soft-float, build only)

    env:
      SOFTFLOAT: -march=rv64ima -mabi=lp64

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the riscv64 toolchain
        run: apt-get install -y autoconf automake libtool make g++-14-riscv64-linux-gnu
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Configure (hard-float, so configure's link tests can run)
        run: |
          set -x
          autoreconf -i
          mkdir build
          cd build
          ../configure --build=$(config/config.guess) --host=riscv64-linux-gnu \
                       --disable-shared --disable-tests --disable-documentation
        env:
          CC: riscv64-linux-gnu-gcc-14
          CXX: riscv64-linux-gnu-g++-14

      - name: Build the objects with the soft-float ABI
        run: |
          set -x
          # Debian's riscv64 glibc ships only the hard-float gnu/stubs-lp64d.h, so
          # gnu/stubs.h cannot be resolved for lp64. The header just #defines a
          # __stub_* macro per unimplemented libc function, which nothing here uses
          # and which cannot matter to a compile-only check, so an empty one does.
          mkdir -p /tmp/lp64-stubs/gnu
          : > /tmp/lp64-stubs/gnu/stubs-lp64.h

          make -C build/src -j$(nproc) \
              CFLAGS="$SOFTFLOAT -isystem /tmp/lp64-stubs -g -O2 -Wall -Wextra" \
              CCASFLAGS="$SOFTFLOAT"

      - name: Assert the objects are soft-float and free of FP instructions
        run: |
          set -eu
          objs=$(mktemp -d)
          find build/src -name '*.a' -print -exec cp {} "$objs" \;
          cd "$objs"
          for a in *.a; do riscv64-linux-gnu-ar x "$a"; done

          # getcontext.S/setcontext.S are the routines whose FP save/restore is
          # guarded by STORE_FP/LOAD_FP; if they are missing the check is vacuous.
          for o in getcontext setcontext; do
              ls | grep -q "$o" || { echo "::error::$o object was not built"; exit 1; }
          done

          # The FP ABI lives in bits 0x6 of e_flags (0 soft, 2 single, 4 double,
          # 6 quad); the remaining bits encode unrelated things such as RVC, so
          # mask rather than compare.
          hard=$(for o in *.o; do
                     f=$(riscv64-linux-gnu-readelf -h "$o" | sed -n 's/.*Flags: *\(0x[0-9a-f]*\).*/\1/p')
                     [ $(( ${f:-0} & 0x6 )) -eq 0 ] || echo "$o=$f"
                 done)
          if [ -n "$hard" ]; then
              echo "::error::objects are not soft-float: $hard"
              exit 1
          fi

          fp=$(riscv64-linux-gnu-objdump -d *.o |
                   grep -oE '\b(fld|fsd|flw|fsw|fadd|fsub|fmul|fdiv|fmv|fcvt|fsgnj|feq|flt|fle|frcsr|fscsr)\.?[a-z]*\b' |
                   sort -u || true)
          if [ -n "$fp" ]; then
              echo "::error::floating-point instructions emitted for a soft-float target: $(echo $fp)"
              exit 1
          fi

          echo "$(ls *.o | wc -l) objects, all soft-float, no FP instructions"

  # Build and run the test suite for the soft-float RISC-V ABI (rv64ima, lp64,
  # __riscv_flen == 0).  No distribution ships a soft-float riscv64 userspace --
  # Alpine and Debian both target lp64d -- so the rootfs is bootstrapped from the
  # bflat soft-float Alpine port and executed through the qemu-riscv64 binfmt
  # handler, which is the same emulation path the other musl jobs use.
  rv64ima-softfloat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: riscv64-linux-musl (rv64ima, soft-float)

    env:
      # apk appends /$arch to the repository URL, so REPO is the base and the
      # package index itself lives at $REPO/riscv64/.
      REPO: https://opensource.interpretica.io/bflat/alpine/b8/main
      ROOTFS: /opt/rv64ima
      # Failures already present on the hard-float riscv64-linux-musl job, i.e.
      # not caused by the soft-float ABI.  Anything outside this list is a
      # genuine regression and fails the job.
      EXPECTED_FAILURES: test-setjmp

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Register the qemu-riscv64 binfmt handler
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: riscv64

      - name: Generate configure (host autotools; output is arch-independent)
        run: autoreconf -i

      - name: Bootstrap the soft-float rootfs
        run: |
          set -eux
          apk=$(curl -fsSL "$REPO/riscv64/" | grep -oE 'apk-tools-static-[^"<]+\.apk' | head -1)
          tmp=$(mktemp -d)
          curl -fsSL "$REPO/riscv64/$apk" | tar -xz -C "$tmp"
          sudo mkdir -p "$ROOTFS"
          sudo "$tmp/sbin/apk.static" \
              --arch riscv64 --repository "$REPO" --allow-untrusted \
              --root "$ROOTFS" --initdb --no-progress add \
              alpine-base build-base make musl-dev linux-headers \
              libucontext-dev xz-dev g++ libstdc++-dev

      - name: Assert the rootfs toolchain really is soft-float
        run: |
          set -eux
          sudo chroot "$ROOTFS" /bin/sh -c '
              gcc --version | head -1
              gcc -dM -E - </dev/null | grep -E "__riscv(_flen|_float_abi|_xlen)?" || true
              # __riscv_flen is only defined when an F/D extension is present; if
              # it is, the rootfs is hard-float and this job would prove nothing.
              if gcc -dM -E - </dev/null | grep -q __riscv_flen; then
                  echo "rootfs toolchain is hard-float -- aborting" >&2
                  exit 1
              fi
          '

      - name: Configure and build
        run: |
          set -eux
          sudo mkdir -p "$ROOTFS/libunwind" "$ROOTFS/proc" "$ROOTFS/sys" "$ROOTFS/dev"
          sudo mount -t proc none "$ROOTFS/proc"
          sudo mount --rbind /sys "$ROOTFS/sys"
          sudo mount --rbind /dev "$ROOTFS/dev"
          sudo cp -a . "$ROOTFS/libunwind"
          sudo chroot "$ROOTFS" /bin/sh -c '
              cd /libunwind
              ./configure --enable-debug \
                  CFLAGS="-g -O0 -Wall -Wextra" CXXFLAGS="-g -O0" LDFLAGS="-g -O0"
              make -j$(nproc)
          '

      - name: Test
        run: |
          set -eu
          # The suite is expected to have pre-existing failures (see
          # EXPECTED_FAILURES), so make's exit status alone is not the verdict:
          # the FAIL list in test-suite.log is.
          sudo chroot "$ROOTFS" /bin/sh -c '
              cd /libunwind && UNW_DEBUG_LEVEL=5 make check -j$(nproc)
          ' && checked=ok || checked=failed

          log="$ROOTFS/libunwind/tests/test-suite.log"
          if [ ! -f "$log" ]; then
              echo "::error::no test-suite.log -- the suite did not run (make check $checked)"
              exit 1
          fi

          sudo grep -E '^(FAIL|ERROR):' "$log" | awk '{print $2}' | sort -u > /tmp/failed || true
          printf '%s\n' $EXPECTED_FAILURES | sort -u > /tmp/expected
          unexpected=$(comm -23 /tmp/failed /tmp/expected)

          echo "failed:     $(tr '\n' ' ' < /tmp/failed)"
          echo "expected:   $(tr '\n' ' ' < /tmp/expected)"

          if [ -n "$unexpected" ]; then
              echo "::error::unexpected test failures on rv64ima soft-float: $(echo $unexpected)"
              exit 1
          fi
          if [ "$checked" = failed ] && [ ! -s /tmp/failed ]; then
              echo "::error::make check failed without reporting a failing test (build error?)"
              exit 1
          fi
          echo "no unexpected failures"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-riscv64-softfloat
          path: |
            /opt/rv64ima/libunwind/**/test-suite.log
            /opt/rv64ima/libunwind/**/config.log
          if-no-files-found: warn
